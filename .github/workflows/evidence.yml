name: Verify experiment evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install repository tools
        run: python -m pip install --no-deps -e .
      - name: Test scoring
        run: python -m unittest discover -s tests -p test_core.py
      - name: Test evidence safeguards
        run: python -m unittest discover -s tests -p test_evidence.py
      - name: Verify recorded results
        run: python -m whisper_precision.verify
      - name: Check reproduction inputs
        run: python -m whisper_precision.prepare --check
